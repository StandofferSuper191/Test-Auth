<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test-Auth Labs | Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        h1 { color: #ffffff; font-size: 32px; margin-bottom: 10px; }
        .subtitle { color: #8b949e; margin-bottom: 40px; font-size: 16px; }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }
        .menu-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: #c9d1d9;
            transition: transform 0.2s, border-color 0.2s;
        }
        .menu-card:hover {
            transform: translateY(-5px);
            border-color: #58a6ff;
            background-color: #1f242c;
        }
        .menu-card h2 { margin: 0 0 10px 0; font-size: 20px; color: #f0f6fc; }
        .menu-card p { font-size: 14px; color: #8b949e; margin: 0; }
    </style>
</head>
<body>

    <h1>Test-Auth Labs</h1>
    <div class="subtitle">Select an authentication method to test</div>

    <div class="menu-grid">
        <a href="biometry.html" class="menu-card">
            <h2>1. Biometry</h2>
            <p>Test Fingerprint, Face ID or Touch ID protection.</p>
        </a>
        <a href="otp.html" class="menu-card">
            <h2>2. OTP Code</h2>
            <p>Test numeric one-time password inputs.</p>
        </a>
        <a href="pattern.html" class="menu-card">
            <h2>3. Pattern Lock</h2>
            <p>Test graphical grid gesture sequence.</p>
        </a>
        <a href="hardware.html" class="menu-card">
            <h2>4. Hardware Key</h2>
            <p>Test external FIDO2 USB tokens like YubiKey.</p>
        </a>
    </div>

</body>
</html>
